{
  "name": "CI",
  "on": {
    "pull_request": {},
    "push": {
      "branches": ["main"]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "pre_product": {
      "name": "Pre-product baseline (Linux)",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Check out repository (actions/checkout v7.0.1)",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": "false"
          }
        },
        {
          "name": "Set up Node.js (actions/setup-node v7.0.0)",
          "uses": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020",
          "with": {
            "node-version": "26.7.0",
            "check-latest": "false",
            "package-manager-cache": "false"
          }
        },
        {
          "name": "Run pre-product checks",
          "shell": "bash",
          "run": "node tools/ci/pre-product-check.test.mjs\nnode tools/ci/pre-product-check.mjs\nnode tools/spikes/dir-m0.10/effect-contract.mjs\nnode tools/spikes/dir-m0.10/guard-mutations.mjs\nnode tools/spikes/dir-m0.6/worktree-ownership.mjs --state-fsync-fixture\nnode tools/spikes/dir-m0.7/github-delivery.mjs --self-test\nnode docs/evidence/m0.14/practical-boundary-contract.mjs\nnode tools/spikes/dir-m0.17/ignored-tree-policy.mjs --timeout-probe"
        }
      ]
    }
  }
}
