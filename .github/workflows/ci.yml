{
  "name": "CI",
  "on": {
    "pull_request": {},
    "push": {
      "branches": ["main"]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "quality": {
      "name": "Scaffold checks (Linux)",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "steps": [
        {
          "name": "Check out repository (actions/checkout v7.0.1)",
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": "false"
          }
        },
        {
          "name": "Set up Node.js (actions/setup-node v7.0.0)",
          "uses": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020",
          "with": {
            "node-version": "26.7.0",
            "check-latest": "false",
            "package-manager-cache": "false"
          }
        },
        {
          "name": "Set up Go (actions/setup-go v7.0.0)",
          "uses": "actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e",
          "with": {
            "go-version": "1.26.5",
            "check-latest": "false",
            "cache": "false"
          }
        },
        {
          "name": "Install exact locked dependencies",
          "shell": "bash",
          "run": "npm ci --ignore-scripts --no-audit --no-fund"
        },
        {
          "name": "Run deterministic scaffold checks",
          "shell": "bash",
          "run": "npm run ci"
        }
      ]
    }
  }
}
