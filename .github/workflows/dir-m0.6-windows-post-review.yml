name: dir-m0.6 Windows post-review evidence

on:
  # Repository policy permits opening this Task's PR only after independent
  # approval. Deliberately omit synchronize so an unreviewed changed SHA cannot
  # produce evidence; close/reopen only after the replacement SHA is approved.
  pull_request:
    types: [opened, reopened]
    branches: [main]
    paths:
      - .github/workflows/dir-m0.6-windows-post-review.yml
      - docs/adr/0007-git-worktree-ownership-and-cleanup.md
      - docs/evidence/m0.6/**
      - tools/spikes/dir-m0.6/worktree-ownership.mjs

permissions:
  contents: read

jobs:
  bounded-windows-proof:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Reject non-SHA inputs
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ($env:CANDIDATE_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'candidate_sha must be a full lowercase SHA' }
          if ($env:BASE_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'base_sha must be a full lowercase SHA' }
      - name: Check out exact approved Candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node.js 24
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact Candidate and base ancestry
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'git rev-parse HEAD failed' }
          if ($actual -cne $env:CANDIDATE_SHA) { throw "checked out $actual instead of approved Candidate" }
          git cat-file -e "$env:BASE_SHA^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'git cat-file base verification failed' }
          git merge-base --is-ancestor $env:BASE_SHA $env:CANDIDATE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'git merge-base ancestry verification failed' }
      - name: Record bounded platform facts and run contract twice
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          if ([string]::IsNullOrWhiteSpace($env:ImageOS)) { throw 'ImageOS is required evidence' }
          if ([string]::IsNullOrWhiteSpace($env:ImageVersion)) { throw 'ImageVersion is required evidence' }
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_OS)) { throw 'RUNNER_OS is required evidence' }
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_ARCH)) { throw 'RUNNER_ARCH is required evidence' }
          "ImageOS=$env:ImageOS"
          "ImageVersion=$env:ImageVersion"
          "RUNNER_OS=$env:RUNNER_OS"
          "RUNNER_ARCH=$env:RUNNER_ARCH"
          node --version
          $nodeMajor = [int]((node --version).TrimStart('v').Split('.')[0])
          if ($nodeMajor -lt 22) { throw 'Node.js 22 or newer is required' }
          git --version
          [System.Environment]::OSVersion.VersionString
          node tools/spikes/dir-m0.6/worktree-ownership.mjs
          $firstRunExit = $LASTEXITCODE
          if ($firstRunExit -ne 0) { throw "first harness run exited $firstRunExit" }
          node tools/spikes/dir-m0.6/worktree-ownership.mjs
          $secondRunExit = $LASTEXITCODE
          if ($secondRunExit -ne 0) { throw "second harness run exited $secondRunExit" }
